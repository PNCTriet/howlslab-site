      </filter>
    </defs>
    <rect width="1600" height="1000" fill="url(#bg)"/>
    <circle cx="1238" cy="182" r="240" fill="#A9C6E4" opacity="0.7" filter="url(#blur)"/>
    <circle cx="262" cy="859" r="280" fill="#ffffff" opacity="0.55" filter="url(#blur)"/>
  
  
    <defs>
