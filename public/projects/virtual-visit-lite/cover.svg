        <circle cx="326" cy="158" r="6" fill="#28c840"/>
        <rect x="650" y="148" width="300" height="20" rx="10" fill="#1d1d1f" opacity="0.06"/>
        <g transform="translate(250 186)">
          <rect x="40" y="48" width="418" height="26" rx="10" fill="#1d1d1f" opacity="0.88"/><rect x="40" y="90" width="330" height="14" rx="7" fill="#1d1d1f" opacity="0.12"/><rect x="40" y="114" width="264" height="14" rx="7" fill="#1d1d1f" opacity="0.08"/><rect x="40" y="168" width="140" height="40" rx="20" fill="#5E87B0" opacity="1"/><rect x="550" y="40" width="484" height="584" rx="28" fill="#5E87B0" opacity="0.16"/>
        </g>
      </g>
