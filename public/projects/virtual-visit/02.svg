<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#E7EEFF"/>
        <stop offset="1" stop-color="#C9D8FF"/>
      </linearGradient>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="54"/>
      </filter>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1d1d1f" flood-opacity="0.12"/>
      </filter>
    </defs>
    <rect width="1600" height="1000" fill="url(#bg)"/>
    <circle cx="1250" cy="170" r="240" fill="#7EA2FF" opacity="0.7" filter="url(#blur)"/>
    <circle cx="250" cy="865" r="280" fill="#ffffff" opacity="0.55" filter="url(#blur)"/>
  
  
    <defs>
      <clipPath id="win">
        <rect x="70" y="60" width="1460" height="880" rx="32"/>
      </clipPath>
    </defs>
    <g filter="url(#shadow)">
      <g clip-path="url(#win)">
        <rect x="70" y="60" width="1460" height="880" fill="#ffffff"/>
        <rect x="70" y="60" width="1460" height="56" fill="#f5f5f7"/>
        <circle cx="102" cy="88" r="6" fill="#ff5f57"/>
        <circle cx="124" cy="88" r="6" fill="#febc2e"/>
        <circle cx="146" cy="88" r="6" fill="#28c840"/>
        <rect x="650" y="78" width="300" height="20" rx="10" fill="#1d1d1f" opacity="0.06"/>
        <g transform="translate(70 116)">
          <rect x="36" y="36" width="684" height="366" rx="24" fill="#3E5BFF" opacity="0.85"/><rect x="740" y="36" width="684" height="366" rx="24" fill="#1d1d1f" opacity="0.06"/><rect x="36" y="422" width="684" height="256.2" rx="24" fill="#1d1d1f" opacity="0.06"/><rect x="740" y="422" width="684" height="256.2" rx="24" fill="#3E5BFF" opacity="0.2"/>
        </g>
      </g>
    </g>
    <rect x="70.5" y="60.5" width="1459" height="879" rx="32" stroke="#1d1d1f" stroke-opacity="0.08"/>
  
</svg>
